[pytest]
testpaths = eval
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -v
    --tb=short
    --color=yes
    --strict-markers

markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (requires Qdrant, etc.)
    slow: Tests that take longer than 5 seconds
