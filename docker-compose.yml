version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: dokter-penjaga-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"   # HTTP API
      - "${QDRANT_GRPC_PORT:-6334}:6334"  # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      # Optional: set QDRANT__SERVICE__API_KEY to protect Qdrant
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
    driver: local
